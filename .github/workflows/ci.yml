name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src api tests scripts
      - name: Type check
        run: mypy src api
      - name: Secrets guard — fail if raw data or env files are tracked
        run: |
          tracked=$(git ls-files 'data/raw/*' '.env' '.env.*' '*.local.yaml')
          if [ -n "$tracked" ]; then
            echo "Sensitive files tracked in git:"; echo "$tracked"; exit 1
          fi
      - name: Tests (synthetic fixture only — data/raw never reaches CI)
        run: pytest
