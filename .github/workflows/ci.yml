name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref. A stale run blocking a merge is
# noise, not a signal.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs first and alone: if commercially sensitive data ever reaches the
  # repo, nothing else about the build matters. The real sales extract lives
  # in data/raw/ and is gitignored; this is the check that proves it stayed
  # that way, on a public repo, on every push.
  secrets-guard:
    name: Secrets guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if raw data, env files or keys are tracked
        run: |
          tracked=$(git ls-files \
            'data/raw/*' '.env' '.env.*' '*.local.yaml' '*.pem' '*.pfx' 'id_rsa*')
          if [ -n "$tracked" ]; then
            echo "::error::Sensitive files tracked in git:"; echo "$tracked"; exit 1
          fi
      - name: Fail if raw data appears anywhere in history
        run: |
          hist=$(git log --all --full-history --oneline -- 'data/raw/*')
          if [ -n "$hist" ]; then
            echo "::error::data/raw touched in history:"; echo "$hist"; exit 1
          fi

  python:
    name: Python lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src api tests scripts
      - name: Type check
        run: mypy src api
      - name: Tests
        # Synthetic fixture only. The real extract never reaches CI, which is
        # also why `make verify` is a local gate and not a job here: it needs
        # data/raw/ to compare against the expected values.
        run: pytest

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # corepack ships with Node, so pnpm comes from the runner's own
      # toolchain rather than a third-party action.
      - name: Enable pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm eslint .
      - name: Type check
        run: pnpm tsc --noEmit
      - name: Build
        # Every data route is server-rendered on demand, so the build does not
        # need the API running.
        run: pnpm build
